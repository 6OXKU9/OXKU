# Tymczasowy test dostępności źródeł notowań z serwerów GitHub (do usunięcia).
name: Test zrodel
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          t() { echo "== $1"; curl -sS -m 20 -A "$UA" -H "Accept: application/json, text/plain, */*" -o /tmp/o -w "HTTP %{http_code} %{size_download}B\n" "$1"; head -c 250 /tmp/o; echo; }
          for s in .SPX .GDAXI @GC.1 @SI.1 @CL.1 EUR= GBP= JPY= PLN= XAU= XAG=; do t "https://ts-api.cnbc.com/harmony/app/bars/$s/1D/20260801000000/20261021000000/adjusted/EST5EDT.json"; done
          t "https://api.nasdaq.com/api/quote/SPX/historical?assetclass=index&fromdate=2026-09-01&limit=3"
          t "https://api.nasdaq.com/api/quote/%5ESPX/historical?assetclass=index&fromdate=2026-09-01&limit=3"
          t "https://api.frankfurter.dev/v1/2026-10-01..?base=EUR&symbols=USD"
